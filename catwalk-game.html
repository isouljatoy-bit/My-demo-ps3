<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glam Runway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #e8417f;
    --pink-dark: #c2185b;
    --ink: #24161f;
    --muted: #8a7584;
    --line: #eadde4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    background: #0a090d;
    color: var(--ink);
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; }

  /* ================= DRESSING ROOM ================= */
  .sidebar {
    width: 330px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #fffafc 0%, #fbeff4 100%);
    border-right: 1px solid #3a2a33;
    padding: 20px 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 5;
  }
  .sidebar h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 30px;
    color: var(--ink);
    text-align: center;
    letter-spacing: .5px;
  }
  .sidebar .subtitle {
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: -8px;
  }
  #categories { display: flex; flex-direction: column; gap: 12px; }
  .category {
    background: #fff;
    border-radius: 14px;
    padding: 12px;
    border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(80, 20, 50, .06);
  }
  .category h3 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--pink-dark);
    margin-bottom: 8px;
  }
  .options { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .opt-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
    text-align: left;
  }
  .opt-btn:hover:not(:disabled) { transform: translateX(3px); background: #fff5f9; border-color: #f2b6cd; }
  .opt-btn.active, .opt-btn.active:hover:not(:disabled) {
    background: #24161f;
    border-color: #24161f;
    color: #fff;
    box-shadow: 0 4px 12px rgba(36, 22, 31, .3);
  }
  .opt-btn:disabled { opacity: .5; cursor: not-allowed; }
  .swatch {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.15), inset 0 -3px 6px rgba(0,0,0,.2);
    flex-shrink: 0;
  }
  .btn {
    font-family: inherit;
    font-weight: 600;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    transition: transform .12s, box-shadow .15s, opacity .15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-random {
    padding: 10px;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-start {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(90deg, #c2185b, #e8417f);
    box-shadow: 0 8px 22px rgba(194, 24, 91, .35);
  }

  /* ================= STAGE ================= */
  .stage {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: #060509;
  }
  .backwall {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 36%;
    background:
      radial-gradient(ellipse 40% 70% at 50% 85%, rgba(255, 235, 245, .22), transparent 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 64px),
      linear-gradient(180deg, #121017 0%, #1c1820 100%);
  }
  .portal {
    position: absolute;
    left: 50%; bottom: 0;
    width: 17%;
    height: 66%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #2b2530 0%, #fff4f9 140%);
    border: 2px solid rgba(255,255,255,.85);
    border-bottom: none;
    box-shadow: 0 0 24px rgba(255, 220, 238, .55), inset 0 0 40px rgba(255, 220, 238, .35);
  }
  .brand {
    position: absolute;
    top: 13%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: #fff;
    white-space: nowrap;
  }
  .brand .name {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: clamp(22px, 3.2vw, 44px);
    letter-spacing: .45em;
    padding-left: .45em;
    text-shadow: 0 0 18px rgba(255, 200, 225, .55);
  }
  .brand .season {
    margin-top: 4px;
    font-size: clamp(9px, .9vw, 12px);
    letter-spacing: .6em;
    color: rgba(255,255,255,.55);
  }
  .floor-dark {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 64%;
    background: linear-gradient(180deg, #0e0c12 0%, #050407 100%);
  }
  .runway-edge {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 64%;
    clip-path: polygon(41.4% 0, 58.6% 0, 93.8% 100%, 6.2% 100%);
    background: linear-gradient(180deg, rgba(255,255,255,.55), #fff);
    z-index: 1;
  }
  .runway {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 64%;
    clip-path: polygon(41.7% 0, 58.3% 0, 93.2% 100%, 6.8% 100%);
    background:
      radial-gradient(ellipse 22% 30% at 50% 80%, rgba(255,255,255,.55), transparent 70%),
      linear-gradient(90deg, transparent 47%, rgba(255,255,255,.35) 50%, transparent 53%),
      linear-gradient(180deg, #3a3540 0%, #8d8794 30%, #d8d3dc 70%, #f3f0f5 100%);
    z-index: 1;
  }
  .runway::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle, rgba(255,255,255,.95) 0 .6px, transparent 1.2px) 0 0 / 23px 19px,
      radial-gradient(circle, rgba(255,215,235,.9) 0 .6px, transparent 1.2px) 11px 7px / 31px 27px;
    opacity: .55;
    animation: shimmer 2.4s ease-in-out infinite alternate;
  }
  @keyframes shimmer { from { opacity: .25; } to { opacity: .7; } }

  .beam {
    position: absolute;
    top: -5%;
    width: 30%;
    height: 110%;
    background: linear-gradient(180deg, rgba(255,250,245,.22), rgba(255,250,245,.04) 70%, transparent);
    clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 3;
    transform-origin: 50% 0;
    filter: blur(6px);
  }
  .beam-c { left: 35%; width: 30%; opacity: .9; }
  .beam-l { left: 2%; animation: sweepL 9s ease-in-out infinite; opacity: .6; }
  .beam-r { right: 2%; animation: sweepR 9s ease-in-out infinite; opacity: .6; }
  @keyframes sweepL { 0%,100% { transform: rotate(-22deg); } 50% { transform: rotate(-10deg); } }
  @keyframes sweepR { 0%,100% { transform: rotate(22deg); } 50% { transform: rotate(10deg); } }
  .haze {
    position: absolute; inset: -10%;
    background:
      radial-gradient(ellipse 40% 25% at 30% 40%, rgba(255,255,255,.05), transparent 70%),
      radial-gradient(ellipse 35% 20% at 70% 55%, rgba(255,230,240,.05), transparent 70%);
    animation: drift 18s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes drift { from { transform: translateX(-4%); } to { transform: translateX(4%); } }

  .crowd { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .person {
    position: absolute;
    transform: translate(-50%, -100%);
  }
  .person .h {
    border-radius: 50% 50% 46% 46%;
    margin: 0 auto;
    background: var(--c);
  }
  .person .b {
    border-radius: 45% 45% 0 0;
    margin-top: 6%;
    background: var(--c);
  }
  .person .phone {
    position: absolute;
    border-radius: 2px;
    background: linear-gradient(160deg, #e9f3ff, #9cc4ff);
    box-shadow: 0 0 10px 2px rgba(170, 205, 255, .6);
  }

  .flash-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .flash-layer.front { z-index: 7; }
  .flash {
    position: absolute;
    width: var(--s, 40px);
    height: var(--s, 40px);
    transform: translate(-50%, -50%);
    animation: pop .45s ease-out forwards;
  }
  .flash .core {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0 18%, rgba(255,255,255,.85) 30%, rgba(225,235,255,.35) 50%, rgba(255,255,255,0) 70%);
  }
  .flash .streak {
    position: absolute;
    left: 50%; top: 50%;
    width: 900%;
    height: 2px;
    transform: translate(-50%, -50%);
    background: linear-gradient(90deg, transparent, rgba(160, 200, 255, .5) 35%, #fff 50%, rgba(160, 200, 255, .5) 65%, transparent);
    filter: blur(.4px);
  }
  .flash .ghost {
    position: absolute;
    width: 40%; height: 40%;
    border-radius: 50%;
    border: 1px solid rgba(200, 220, 255, .35);
    left: 160%; top: 120%;
  }
  @keyframes pop {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(.4); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.15); }
  }
  .white-out {
    position: absolute; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 9;
  }
  .white-out.go { animation: whiteout .3s ease-out; }
  @keyframes whiteout { 0% { opacity: .55; } 100% { opacity: 0; } }

  .vignette {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 8;
    background: radial-gradient(ellipse 75% 70% at 50% 55%, transparent 55%, rgba(0,0,0,.6) 100%);
  }
  .grain {
    position: absolute; inset: -50%;
    pointer-events: none;
    z-index: 8;
    opacity: .09;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation: grain .6s steps(4) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0, 0); } 25% { transform: translate(-3%, 2%); }
    50% { transform: translate(2%, -3%); } 75% { transform: translate(-2%, -1%); } 100% { transform: translate(0, 0); }
  }

  /* ================= MODEL ================= */
  .model-wrap {
    position: absolute;
    left: 50%;
    bottom: 2.5%;
    height: 80%;
    aspect-ratio: 200 / 360;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    z-index: 4;
  }
  .model-wrap.walk { animation: walkForward 5.2s cubic-bezier(.4,.1,.5,1) forwards; }
  @keyframes walkForward {
    0% { transform: translate(-50%, -78%) scale(.36); opacity: 0; filter: brightness(.6); }
    8% { opacity: 1; }
    100% { transform: translate(-50%, 0) scale(1); opacity: 1; filter: brightness(1); }
  }
  .floor-glow {
    position: absolute;
    left: 50%; bottom: -3%;
    width: 120%; height: 10%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(255,255,255,.45), transparent 70%);
    pointer-events: none;
  }
  .model-bob {
    width: 100%; height: 100%;
    -webkit-box-reflect: below -3px linear-gradient(transparent 72%, rgba(255,255,255,.22));
  }
  #doll {
    width: 100%; height: 100%;
    overflow: visible;
    display: block;
    transition: filter .06s;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
  }
  #doll.lit { filter: brightness(1.35) contrast(1.05) drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  #doll.pop { animation: dollPop .4s ease-out; }
  @keyframes dollPop { 0% { transform: scale(1); } 40% { transform: scale(1.015); } 100% { transform: scale(1); } }

  #legL { transform-origin: 90px 158px; }
  #legR { transform-origin: 110px 158px; }
  #armR { transform-origin: 123px 80px; }
  #armL { transform-origin: 77px 80px; }
  #hairBack { transform-origin: 100px 12px; }
  #skirt { transform-origin: 100px 130px; }

  .model-wrap.walk .model-bob { animation: bob .55s ease-in-out infinite; }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-.8deg); }
    50% { transform: translateY(-1.2%) rotate(.8deg); }
  }
  #doll.walking #legL { animation: stepL .55s ease-in-out infinite; }
  #doll.walking #legR { animation: stepR .55s ease-in-out infinite; }
  #doll.walking #hairBack { animation: hairSway .55s ease-in-out infinite; }
  #doll.walking #skirt { animation: skirtSway .55s ease-in-out infinite; }
  #doll.walking #armR { animation: armSwing 1.1s ease-in-out infinite; }
  @keyframes stepL { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px) rotate(1.5deg); } }
  @keyframes stepR { 0%,100% { transform: translateY(-5px) rotate(-1.5deg); } 50% { transform: translateY(0); } }
  @keyframes hairSway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  @keyframes skirtSway { 0%,100% { transform: rotate(-1.8deg) skewX(1deg); } 50% { transform: rotate(1.8deg) skewX(-1deg); } }
  @keyframes armSwing { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-5deg); } }

  #doll.posing #armR { animation: pose 1.6s ease-in-out forwards; }
  #doll.posing #hairBack { animation: hairFlip .9s ease-out; }
  @keyframes pose { 0% { transform: rotate(0); } 30%,100% { transform: rotate(-14deg); } }
  @keyframes hairFlip { 0% { transform: rotate(0); } 40% { transform: rotate(4deg); } 70% { transform: rotate(-2deg); } 100% { transform: rotate(0); } }

  .caption {
    position: absolute;
    top: calc(36% + 14px);
    left: 14px;
    max-width: 30%;
    background: rgba(10, 8, 12, .7);
    border: 1px solid rgba(255,255,255,.18);
    color: #fff;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 12px;
    backdrop-filter: blur(6px);
    z-index: 7;
    opacity: 0;
    transition: opacity .4s, transform .4s;
  }
  .caption b { display: block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #f48fb1; margin-bottom: 2px; }
  .caption.show { opacity: 1; transform: translateY(-4px); }
  .hint {
    position: absolute;
    right: 16px; bottom: 14px;
    color: rgba(255,255,255,.6);
    font-size: 12px;
    letter-spacing: .5px;
    z-index: 9;
    transition: opacity .3s;
  }

  /* ================= SCORECARD ================= */
  .scorecard {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(6, 4, 8, .6);
    backdrop-filter: blur(4px);
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s;
  }
  .scorecard.show { opacity: 1; pointer-events: auto; }
  .score-panel {
    background: #fffafc;
    border-radius: 22px;
    padding: 24px 22px 20px;
    width: min(720px, 100%);
    max-height: 100%;
    overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    transform: scale(.9);
    transition: transform .4s cubic-bezier(.2,1.3,.4,1);
    text-align: center;
  }
  .scorecard.show .score-panel { transform: scale(1); }
  .score-panel h2 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 32px;
  }
  .outfit-line { font-size: 12px; color: var(--muted); margin: 4px 0 16px; letter-spacing: .5px; }
  .judges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .judge {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 10px;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .4s, transform .4s;
  }
  .judge.in { opacity: 1; transform: translateY(0); }
  .judge .avatar {
    width: 54px; height: 54px; border-radius: 50%;
    margin: 0 auto 6px;
    display: grid; place-items: center;
    font-size: 28px;
    background: #fbeff4;
  }
  .judge .name { font-weight: 700; font-size: 14px; }
  .judge .role { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .judge .score { font-family: 'Playfair Display', serif; font-size: 40px; font-weight: 700; color: var(--pink-dark); line-height: 1.1; }
  .judge .score small { font-family: 'Poppins', sans-serif; font-size: 14px; color: #c9a9b9; }
  .hearts { font-size: 10px; letter-spacing: 1px; margin: 4px 0 6px; }
  .judge .comment { font-size: 12.5px; font-style: italic; color: #5d4655; min-height: 36px; }
  .total-box { margin-top: 16px; opacity: 0; transition: opacity .5s; }
  .total-box.in { opacity: 1; }
  .total { font-size: 20px; font-weight: 700; }
  .total span { color: var(--pink-dark); }
  .rank {
    display: inline-block;
    margin-top: 6px;
    padding: 6px 18px;
    border-radius: 999px;
    background: #24161f;
    color: #fff;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .notes { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .note { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: #f6e9f0; color: #8a2a58; }
  .note.bad { background: #fde8e4; color: #b23a22; }
  .score-actions { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .score-actions .btn { padding: 12px 22px; font-size: 14px; }
  .btn-pink { background: linear-gradient(90deg, #c2185b, #e8417f); color: #fff; }
  .btn-dark { background: #24161f; color: #fff; }

  .confetti {
    position: absolute;
    top: -20px;
    width: 8px; height: 12px;
    z-index: 11;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 820px) {
    body { overflow: auto; }
    .app { flex-direction: column-reverse; height: auto; }
    .stage { height: 74vh; min-height: 480px; flex: none; }
    .sidebar { width: 100%; border-right: none; overflow: visible; padding: 16px; }
    .options { grid-template-columns: 1fr 1fr 1fr; }
    .opt-btn { flex-direction: column; text-align: center; font-size: 12px; gap: 4px; padding: 8px 4px; }
    .judges { grid-template-columns: 1fr; }
    .caption { max-width: 60%; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ DRESSING ROOM ============ -->
  <aside class="sidebar">
    <h1>Dressing Room</h1>
    <p class="subtitle">Style the look · Walk the show</p>
    <div id="categories"></div>
    <button class="btn btn-random" id="randomBtn">🎲 Surprise Me</button>
    <button class="btn btn-start" id="startBtn">Start Runway Show</button>
  </aside>

  <!-- ============ STAGE ============ -->
  <main class="stage" id="stage">
    <div class="backwall">
      <div class="brand"><div class="name">GLAM RUNWAY</div><div class="season">FALL · WINTER COLLECTION</div></div>
      <div class="portal"></div>
    </div>
    <div class="floor-dark"></div>
    <div class="flash-layer" id="flashBack"></div>
    <div class="runway-edge"></div>
    <div class="runway"></div>
    <div class="crowd" id="crowd"></div>
    <div class="beam beam-l"></div>
    <div class="beam beam-c"></div>
    <div class="beam beam-r"></div>
    <div class="haze"></div>

    <div class="model-wrap" id="modelWrap">
      <div class="floor-glow"></div>
      <div class="model-bob">
        <svg id="doll" viewBox="0 0 200 360" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- ---------- SKIN ---------- -->
            <linearGradient id="skinH" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#b9785c"/>
              <stop offset=".18" stop-color="#dfa585"/>
              <stop offset=".45" stop-color="#f6cfb4"/>
              <stop offset=".62" stop-color="#f1c2a3"/>
              <stop offset=".85" stop-color="#d69a7b"/>
              <stop offset="1" stop-color="#ad6f55"/>
            </linearGradient>
            <linearGradient id="skinTorso" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#c38466"/>
              <stop offset=".2" stop-color="#e7b293"/>
              <stop offset=".42" stop-color="#f8d4bb"/>
              <stop offset=".6" stop-color="#f4c9ad"/>
              <stop offset=".82" stop-color="#e0a687"/>
              <stop offset="1" stop-color="#b97a5d"/>
            </linearGradient>
            <radialGradient id="skinFace" cx=".46" cy=".42" r=".62">
              <stop offset="0" stop-color="#fbdcc6"/>
              <stop offset=".55" stop-color="#f3c6a8"/>
              <stop offset=".85" stop-color="#dfa385"/>
              <stop offset="1" stop-color="#c2846a"/>
            </radialGradient>
            <radialGradient id="iris" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#9fd0f2"/>
              <stop offset=".45" stop-color="#4f93c9"/>
              <stop offset=".85" stop-color="#28507f"/>

<script>
/* =========================================================
   WARDROBE DATA
   cute / style: base ratings (1-10)
   vibes: tags used for outfit harmony + judge preferences
   ========================================================= */
const CATALOG = {

    label: 'Hairstyles',
    items: {

      bob:      { name: 'Bob Cut',       swatch: 'linear-gradient(135deg,#f3dc9c,#b88a3a)', cute: 7, style: 9, vibes: ['edgy', 'classic'] },
      waves:    { name: 'Long Waves',    swatch: 'linear-gradient(135deg,#fff3cf,#d4aa5b)', cute: 9, style: 8, vibes: ['glam', 'cute'] }

  },

      whiteTee:    { name: 'White Ribbed Tee', swatch: 'repeating-linear-gradient(90deg,#f6f3ee 0 3px,#d9d3cb 3px 4px)', cute: 7, style: 8, vibes: ['classic', 'sporty'] },
      neonGreen:   { name: 'Neon Green Crop',  swatch: 'linear-gradient(135deg,#d2ff6a,#5df03a)', cute: 6, style: 8, vibes: ['edgy', 'sporty'] }
    }
  },

      pastelPink: { name: 'Pastel Pink Pleated', swatch: 'linear-gradient(135deg,#fbe1eb,#f1b3cb)', cute: 10, style: 7, vibes: ['pink', 'cute', 'glam'] },
      denim:      { name: 'Denim Skirt',         swatch: 'linear-gradient(135deg,#5579ab,#2f4f7d)', cute: 7, style: 8, vibes: ['sporty', 'edgy'] }
    }
  },
  shoes: {
    label: 'Shoes',
    items: {
      sneakers: { name: 'White Sneakers',  swatch: 'linear-gradient(135deg,#ffffff 55%,#e8417f 55%)', cute: 7, style: 7, vibes: ['sporty', 'cute'] },
      heels:    { name: 'Pink High Heels', swatch: 'linear-gradient(135deg,#ff6fae,#7c0838)', cute: 9, style: 9, vibes: ['glam', 'pink'] },
      boots:    { name: 'Cute Boots',      swatch: 'linear-gradient(135deg,#e3a2b6,#8f4a61)', cute: 8, style: 9, vibes: ['edgy', 'classic', 'cute'] }
    }
  }
};

const state = { hair: 'waves', top: 'pinkGlitter', skirt: 'pastelPink', shoes: 'heels' };

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */
const $ = id => document.getElementById(id);
const doll = $('doll');

// small seeded RNG so hair strands look the same every time a style is picked
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const lerp = (a, b, t) => a + (b - a) * t;
const f = n => n.toFixed(2);

// mirror a path (made only of M/L/C/Q/Z commands with x y pairs) across x = 100
function mirror(d) {
  return d.replace(/(-?\d*\.?\d+)[ ,](-?\d*\.?\d+)/g, (m, x, y) => `${f(200 - parseFloat(x))} ${y}`);
}

// Catmull-Rom sampling of a polyline into a dense list of points
function densify(pts, m) {
  const out = [];
  const segs = pts.length - 1;
  for (let i = 0; i <= m; i++) {
    const u = (i / m) * segs;
    const k = Math.min(segs - 1, Math.floor(u));
    const t = u - k;
    const p0 = pts[Math.max(0, k - 1)], p1 = pts[k], p2 = pts[k + 1], p3 = pts[Math.min(pts.length - 1, k + 2)];
    const t2 = t * t, t3 = t2 * t;
    const c = (a, b, c2, d) => 0.5 * ((2 * b) + (-a + c2) * t + (2 * a - 5 * b + 4 * c2 - d) * t2 + (-a + 3 * b - 3 * c2 + d) * t3);
    out.push([c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1])]);
  }
  return out;
}

// smooth SVG path through points
function smooth(pts) {
  let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${f(c1[0])} ${f(c1[1])} ${f(c2[0])} ${f(c2[1])} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d;
}

// a tapered limb segment (quad) between two joints
function limb(a, b, wa, wb) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len = Math.hypot(dx, dy);
  const nx = -dy / len, ny = dx / len;
  return `M${f(a[0] + nx * wa / 2)} ${f(a[1] + ny * wa / 2)} L${f(b[0] + nx * wb / 2)} ${f(b[1] + ny * wb / 2)}
    L${f(b[0] - nx * wb / 2)} ${f(b[1] - ny * wb / 2)} L${f(a[0] - nx * wa / 2)} ${f(a[1] - ny * wa / 2)} Z`;
}

let clipId = 0;
function clipped(d, inner, fill) {
  const id = 'c' + (clipId++);
  const parts = Array.isArray(d) ? d : [d];
  return `<clipPath id="${id}">${parts.map(p => `<path d="${p}"/>`).join('')}</clipPath>
    ${parts.map(p => `<path d="${p}" fill="${fill}"/>`).join('')}
    <g clip-path="url(#${id})">${inner}</g>`;
}

/* =========================================================
   HAIR — built from hundreds of individual strands
   ========================================================= */
const HAIR_TONES = ['#fbedc0', '#f3dc9c', '#e2bd6c', '#d4aa5b', '#c99b48', '#fff6da', '#b88a3a'];

// strands spread between an inner and outer guide curve
function strandSheet(inner, outer, opts) {
  const { n = 80, seed = 1, wave = 0, waveStart = 40, freq = .14, jitter = .6, taper = 0, ragged = .08 } = opts;
  const r = rng(seed);
  const A = densify(inner, 30), B = densify(outer, 30);
  const base = [], main = [], hi = [];

  // solid under-mass so there are no gaps between strands
  const massLen = Math.round(A.length * (1 - ragged * .9));
  const massPts = A.slice(0, massLen).concat(B.slice(0, massLen).reverse()).map(p => [p[0] + waveOff(p[1], 0, wave, waveStart, freq), p[1]]);
  let mass = `M${f(massPts[0][0])} ${f(massPts[0][1])}` + massPts.slice(1).map(p => ` L${f(p[0])} ${f(p[1])}`).join('') + ' Z';
  base.push(`<path d="${mass}" fill="url(#hairDeep)" filter="url(#b05)"/>`);

  for (let i = 0; i < n; i++) {
    const t = Math.min(1, Math.max(0, (i + r() * .9) / n));
    const phase = (r() - .5) * .8;
    const lenCut = 1 - r() * ragged - taper * Math.abs(t - .5);
    const count = Math.max(4, Math.round(A.length * lenCut));
    const pts = [];
    for (let k = 0; k < count; k++) {
      const x = lerp(A[k][0], B[k][0], t) + (k > 2 ? (r() - .5) * jitter * .4 : 0);
      const y = lerp(A[k][1], B[k][1], t);
      pts.push([x + waveOff(y, phase, wave, waveStart, freq), y]);
    }
    const d = smooth(pts);
    const roll = r();
    if (roll < .3) {
      base.push(`<path d="${d}" stroke="url(#hairDeep)" stroke-width="${f(1 + r() * .8)}" fill="none" opacity=".9"/>`);
    } else if (roll < .88) {
      const stroke = r() < .65 ? 'url(#hairGrad)' : HAIR_TONES[Math.floor(r() * HAIR_TONES.length)];
      main.push(`<path d="${d}" stroke="${stroke}" stroke-width="${f(.35 + r() * .55)}" fill="none" opacity="${f(.6 + r() * .4)}" stroke-linecap="round"/>`);
    } else {
      hi.push(`<path d="${d}" stroke="#fffbea" stroke-width="${f(.2 + r() * .25)}" fill="none" opacity="${f(.35 + r() * .35)}" stroke-linecap="round"/>`);
    }
  }
  return base.join('') + main.join('') + hi.join('');
}
function waveOff(y, phase, amp, start, freq) {
  if (!amp || y < start) return 0;
  const ramp = Math.min(1, (y - start) / 25);
  return Math.sin(y * freq + phase) * amp * ramp;
}
const mirrorPts = pts => pts.map(p => [200 - p[0], p[1]]);

// soft shadow the hair casts on the forehead/cheeks
function hairShadow(pts, dx) {
  const d = smooth(densify(pts, 12).map(p => [p[0] + dx, p[1] + 1]));
  return `<path d="${d}" stroke="#5a2e1c" stroke-width="3" fill="none" opacity=".35" filter="url(#b1)"/>`;
}

function buildHair(style) {
  if (style === 'waves') {
    const innerL = [[99.5, 14.5], [93, 16.5], [88, 25], [86, 40], [86.5, 56], [85, 80], [86, 110], [88, 142]];
    const outerL = [[99.5, 13], [90, 9.5], [82, 18], [79.5, 36], [77, 58], [72.5, 85], [70.5, 115], [72, 146]];
    const backInL = [[100, 14], [97, 30], [92, 70], [90, 148]];
    const backOutL = [[100, 12], [81, 20], [70, 70], [66, 150]];
    const w = { wave: 2.2, waveStart: 48, freq: .13, ragged: .36 };
    return {
      back: strandSheet(backInL, backOutL, { n: 70, seed: 11, ...w }) +
            strandSheet(mirrorPts(backInL), mirrorPts(backOutL), { n: 70, seed: 12, ...w }),
      front: hairShadow(innerL.slice(0, 5), 1.2) + hairShadow(mirrorPts(innerL).slice(0, 5), -1.2) +
            strandSheet(innerL, outerL, { n: 150, seed: 21, ...w }) +
            strandSheet(mirrorPts(innerL), mirrorPts(outerL), { n: 150, seed: 22, ...w })
    };
  }
  if (style === 'bob') {
    const inL = [[95, 14], [91, 17], [87.6, 26], [86.6, 40], [87.2, 52], [88.6, 60]];
    const outL = [[95, 12.8], [86, 11], [80.5, 22], [79, 40], [79.2, 53], [81.5, 61.5]];
    const inR = [[95.5, 14.5], [104, 16], [111.6, 25], [113.6, 40], [113, 52], [111.4, 60]];
    const outR = [[95.5, 12.8], [108, 10], [119, 21], [121, 40], [120.8, 53], [118.5, 61.5]];
    const backIn = [[100, 18], [99, 40], [99, 62]];
    const backOut = [[100, 14], [80, 30], [81, 63]];
    return {
      back: strandSheet(backIn, backOut, { n: 50, seed: 31 }) +
            strandSheet(mirrorPts(backIn), mirrorPts(backOut), { n: 50, seed: 32 }),
      front: hairShadow(inL.slice(0, 4), 1) + hairShadow(inR.slice(0, 4), -1) +
            strandSheet(inL, outL, { n: 110, seed: 41, jitter: .3 }) +
            strandSheet(inR, outR, { n: 140, seed: 42, jitter: .3 })
    };
  }
  // high ponytail: hair swept up from the hairline to a crown elastic
  const r = rng(51);
  const hairline = densify([[100, 17.6], [93.5, 18.4], [89, 22.4], [86.8, 29], [86.3, 37]], 60);
  let cap = `<path d="M85.6 38 C84 20 91 9.5 100 9.5 C109 9.5 116 20 114.4 38 C113 28 109 19.5 100 18.5 C91 19.5 87 28 85.6 38 Z" fill="url(#hairDeep)"/>`;
  let strands = '';
  for (let side of [-1, 1]) {
    for (let i = 0; i < 140; i++) {
      const h = hairline[Math.floor(r() * hairline.length)];
      const hx = side < 0 ? h[0] : 200 - h[0];
      const crown = [100 + (r() - .5) * 3, 8.5 + r() * .8];
      const mid = [100 + (hx - 100) * 1.16, h[1] * .42 + crown[1] * .58 - 1.5];
      const d = smooth([[hx, h[1]], mid, crown]);
      const roll = r();
      const stroke = roll < .25 ? 'url(#hairDeep)' : roll < .85 ? 'url(#hairGrad)' : '#fffbea';
      strands += `<path d="${d}" stroke="${stroke}" stroke-width="${f(.3 + r() * .5)}" fill="none" opacity="${f(.65 + r() * .35)}"/>`;
    }
  }
  const tailIn = [[100, 8], [104, 3], [110, 3.5], [115, 13], [117, 30], [116, 56], [113, 86], [111, 118]];
  const tailOut = [[100, 8], [106, 1.5], [115, 2.5], [121.5, 13], [124, 32], [124, 58], [120.5, 88], [114.5, 121]];
  return {
    back: strandSheet(tailIn, tailOut, { n: 170, seed: 61, wave: 1.4, waveStart: 30, freq: .16, taper: .4 }),
    front: hairShadow([[100, 18], [93, 19], [89, 23], [87, 30]], 1) + hairShadow(mirrorPts([[100, 18], [93, 19], [89, 23], [87, 30]]), -1) +
      cap + strands +
      `<ellipse cx="100" cy="8.4" rx="4.4" ry="2.4" fill="#b0124f"/>
       <ellipse cx="100" cy="7.8" rx="3.6" ry="1.3" fill="#e8417f" opacity=".8"/>
       <path d="M96.5 8.4 Q100 10.4 103.5 8.4" stroke="#6d0a31" stroke-width=".4" fill="none"/>`

   ========================================================= */
function pleatedSkirt(fill, edge, band, extras = '', texture = false) {
  const n = 14;
  const waist = [], hem = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    const wx = 86.5 + u * 27;
    waist.push([wx, 130 + 1.2 * Math.sin(u * Math.PI)]);
    const hx = 63 + u * 74;
    const curve = 3.2 * Math.sin(u * Math.PI);
    hem.push([hx, 194 + curve + (i % 2 ? -.8 : 0)]);
  }
  let outline = `M${f(waist[0][0])} ${f(waist[0][1])}`;
  waist.slice(1).forEach(p => outline += ` L${f(p[0])} ${f(p[1])}`);
  for (let i = n; i >= 0; i--) outline += ` L${f(hem[i][0])} ${f(hem[i][1])}`;
  outline += ' Z';
  let panels = '';
  for (let i = 0; i < n; i++) {
    const pts = `${f(waist[i][0])},${f(waist[i][1])} ${f(waist[i + 1][0])},${f(waist[i + 1][1])} ${f(hem[i + 1][0])},${f(hem[i + 1][1])} ${f(hem[i][0])},${f(hem[i][1])}`;
    panels += `<polygon points="${pts}" fill="url(#pleatG)"/>`;
    panels += `<line x1="${f(waist[i + 1][0])}" y1="${f(waist[i + 1][1])}" x2="${f(hem[i + 1][0])}" y2="${f(hem[i + 1][1])}" stroke="${edge}" stroke-width=".35" opacity=".8"/>`;
  }
  const bandPath = 'M86 125.6 Q100 127.4 114 125.6 L114.4 131.6 Q100 133.4 85.6 131.6 Z';
  const skirt = clipped(outline, `${panels}<path d="${outline}" fill="url(#volH)"/>
      <ellipse cx="100" cy="138" rx="16" ry="5" fill="#000" opacity=".22" filter="url(#b2)"/>`, fill) +
    `<path d="${outline}" fill="none" stroke="${edge}" stroke-width=".4"/>` +
    clipped(bandPath, `<path d="${bandPath}" fill="url(#volH)"/>`, band) + extras;
  return texture ? `<g filter="url(#fabric)">${skirt}</g>` : skirt;
}

  boots: () => {
    let fur = '';
    const r = rng(77);
    for (let i = 0; i < 40; i++) {
      const x = 86 + r() * 14.5, y = 287 + r() * 4;
      fur += `<path d="M${f(x)} ${f(y)} q${f((r() - .5) * 2)} ${f(-1 - r() * 2)} ${f((r() - .5) * 2.4)} ${f(-1.5 - r() * 2)}" stroke="${r() < .5 ? '#fff' : '#efe6ea'}" stroke-width=".7" fill="none" stroke-linecap="round"/>`;
    }
    const boot = 'M87 289 L99.6 289 C99.6 300 98.2 312 97.4 320 L97.2 338 C98.4 343 98.6 348 97 351.4 L89.4 351.4 C87.8 348 88 343 89 338 L88.5 320 C88 310 87 300 87 289 Z';
    return clipped(boot, `
        <path d="M90 292 C90.5 305 91.2 320 91.5 340" stroke="#fff" stroke-width="1.6" fill="none" opacity=".3" filter="url(#b05)"/>
        <path d="M88 339 Q93 341.5 98 339" stroke="#7a3a51" stroke-width=".7" fill="none" opacity=".6"/>
        <path d="M96.6 293 L96.4 336" stroke="#f9d7e2" stroke-width=".35" stroke-dasharray="1 .8"/>`, 'url(#suede)') +
      `<g filter="url(#fabric)"><path d="${boot}" fill="none"/></g>
       <path d="M89.6 351 L96.8 351 L96.4 353 L90 353 Z" fill="#4a1f2e"/>
       <ellipse cx="93.3" cy="289.6" rx="7.6" ry="2.6" fill="#f3ecef"/>${fur}`;
  }
};

/* =========================================================
   RENDER
   ========================================================= */
function renderStatic() {
  $('head').innerHTML = `<g transform="translate(0 3.5)">${buildHead()}</g>`;
  $('torso').innerHTML = buildTorso();
  const arms = buildArms();
  $('armL').innerHTML = arms.L;
  $('armR').innerHTML = arms.R;
  $('legLBody').innerHTML = buildLeg(-1);
  $('legRBody').innerHTML = buildLeg(1);
}

function renderDoll() {
  if (!HAIR_CACHE[state.hair]) HAIR_CACHE[state.hair] = buildHair(state.hair);
  $('hairBack').innerHTML = `<g transform="translate(0 3.5)">${HAIR_CACHE[state.hair].back}</g>`;
  $('hairFront').innerHTML = `<g transform="translate(0 3.5)">${HAIR_CACHE[state.hair].front}</g>`;
  $('top').innerHTML = TOPS[state.top]();
  $('skirt').innerHTML = SKIRTS[state.skirt]();
  const shoe = SHOES[state.shoes]();
  $('shoeL').innerHTML = shoe;
  $('shoeR').innerHTML = `<g transform="translate(200 0) scale(-1 1)">${shoe}</g>`;
}

function popDoll() {
  doll.classList.remove('pop');
  void doll.getBoundingClientRect();
  doll.classList.add('pop');
}

function buildSidebar() {
  const host = $('categories');
  for (const [cat, data] of Object.entries(CATALOG)) {
    const box = document.createElement('div');
    box.className = 'category';
    box.innerHTML = `<h3>${data.label}</h3><div class="options"></div>`;
    const opts = box.querySelector('.options');
    for (const [key, item] of Object.entries(data.items)) {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.dataset.cat = cat;
      b.dataset.key = key;
      b.innerHTML = `<span class="swatch" style="background:${item.swatch}"></span><span>${item.name}</span>`;
      b.addEventListener('click', () => {
        if (showing) return;
        state[cat] = key;
        renderDoll();
        refreshActive();
        popDoll();
        cameraFlash(false);
      });
      opts.appendChild(b);
    }
    host.appendChild(box);
  }
  refreshActive();
}

function refreshActive() {
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.classList.toggle('active', state[b.dataset.cat] === b.dataset.key);
  });
}

/* =========================================================
   AUDIENCE — seated rows in perspective along the runway
   ========================================================= */
const cameraSpots = [];
function buildCrowd() {
  const host = $('crowd');
  const r = rng(99);
  const tones = ['#141118', '#1a1520', '#100d13', '#1d1823', '#17121b'];
  const rows = [0.08, 0.2, 0.34, 0.5, 0.68, 0.88];
  for (const side of [-1, 1]) {
    rows.forEach((fr, ri) => {
      const top = 36 + fr * 64;              // % from top
      const edge = 41.4 - fr * 35.2;         // runway edge x (left side) in %
      const size = 10 + fr * 46;             // head size in px
      const gap = 2.4 + fr * 6.5;            // % spacing
      for (let k = 0; ; k++) {
        const xL = edge - 2.2 - fr * 3 - k * gap - (ri % 2) * gap * .5;
        if (xL < -4) break;
        const x = side < 0 ? xL : 100 - xL;
        const p = document.createElement('div');
        p.className = 'person';
        p.style.left = x + '%';
        p.style.top = top + '%';
        p.style.setProperty('--c', tones[Math.floor(r() * tones.length)]);
        const hs = size * (.85 + r() * .3);
        p.style.filter = `blur(${fr > .8 ? 2.2 : fr < .15 ? 1.4 : .6}px)`;
        const rim = side < 0 ? '-' : '';
        p.innerHTML = `<div class="h" style="width:${hs * .62}px;height:${hs * .72}px;box-shadow:inset ${rim}${hs * .08}px 0 ${hs * .1}px rgba(255,225,240,.22)"></div>
          <div class="b" style="width:${hs * 1.45}px;height:${hs * .9}px;box-shadow:inset ${rim}${hs * .1}px 0 ${hs * .14}px rgba(255,225,240,.16)"></div>`;
        if (r() < .3) {
          const ph = document.createElement('div');
          ph.className = 'phone';
          ph.style.width = hs * .28 + 'px';
          ph.style.height = hs * .45 + 'px';
          ph.style.left = (hs * .55) + 'px';
          ph.style.top = (hs * .5) + 'px';
          p.appendChild(ph);
          cameraSpots.push([x + (side < 0 ? .8 : -.8), top - fr * 6, fr]);
        }
        host.appendChild(p);
      }
    });
  }
}

/* =========================================================
   CAMERA FLASHES
   ========================================================= */
function spawnFlash(layer, xPct, yPct, size) {
  const el = document.createElement('div');
  el.className = 'flash';
  el.style.left = xPct + '%';
  el.style.top = yPct + '%';
  el.style.setProperty('--s', size + 'px');
  el.innerHTML = '<div class="core"></div><div class="streak"></div><div class="ghost"></div>';
  el.addEventListener('animationend', () => el.remove());
  layer.appendChild(el);
}

let litTimer;
function lightModel() {
  doll.classList.add('lit');
  clearTimeout(litTimer);
  litTimer = setTimeout(() => doll.classList.remove('lit'), 70);
}

function cameraFlash(intense) {
  const roll = Math.random();
  if (roll < .55 && cameraSpots.length) {
    const [x, y, fr] = cameraSpots[Math.floor(Math.random() * cameraSpots.length)];
    spawnFlash($('flashFront'), x, y, (intense ? 30 : 20) + fr * 50);
  } else if (roll < .8) {
    // photographers' pit at the foot of the runway
    spawnFlash($('flashFront'), 15 + Math.random() * 70, 96 + Math.random() * 6, intense ? 90 + Math.random() * 60 : 60);
  } else {
    spawnFlash($('flashBack'), 5 + Math.random() * 90, 38 + Math.random() * 15, 14 + Math.random() * 14);
  }
  if (intense || Math.random() < .5) lightModel();
}

function whiteOut() {
  const w = $('whiteOut');
  w.classList.remove('go');
  void w.offsetWidth;
  w.classList.add('go');
}

// occasional idle flashes from the audience
setInterval(() => { if (!showing && Math.random() < .5) cameraFlash(false); }, 1100);

/* =========================================================
   SCORING
   ========================================================= */
const JUDGES = [
  {
    name: 'Madame Vogue', role: 'Editor-in-Chief', avatar: '👩‍🦳', cuteW: .3, styleW: .7, fav: 'classic',
    lines: [
      ['Hmm. The runway deserves more, darling.', 'Not quite magazine-ready yet.'],
      ['Pleasant. I see potential, darling.', 'A respectable look — refine it.'],
      ['Très chic! This could make my cover.', 'Polished and confident. I approve.'],
      ['Iconic. Simply iconic. Cover girl!', 'Perfection. I have nothing to add.']
    ]
  },
  {
    name: 'Glitter Gigi', role: 'Sparkle Specialist', avatar: '🧚‍♀️', cuteW: .75, styleW: .25, fav: 'pink',
    lines: [
      ['Needs more sparkle, sweetie!', 'Where is the pink?! 🥺'],
      ['Cute! Add a little extra shine!', 'Aww, adorable vibes!'],
      ['Sooo cute I could squeal! 💖', 'Sparkly, sweet and totally fun!'],
      ['OMG DREAM DOLL!!! 💖✨💖', 'The cutest look I have EVER seen!']
    ]
  },
  {
    name: 'Coach Strut', role: 'Street-Style Guru', avatar: '😎', cuteW: .5, styleW: .5, fav: 'sporty',
    lines: [
      ['The pieces aren’t talking to each other.', 'Kinda clashing — mix it up!'],
      ['Solid fit, needs more attitude.', 'Good walk, the fit is okay.'],
      ['That fit goes HARD. Love it.', 'Fresh, fun and fierce!'],
      ['Ten out of ten. Absolute legend.', 'Runway royalty right here! 👑']
    ]
  }
];

const COMBOS = [
  { req: { top: 'pinkGlitter', skirt: 'pastelPink', shoes: 'heels' }, bonus: 1.2, label: '💖 Total Dream Doll!' },
  { req: { top: 'whiteTee', skirt: 'plaid', shoes: 'boots' }, bonus: 1, label: '📚 Preppy Perfection' },
  { req: { top: 'neonGreen', skirt: 'denim', shoes: 'sneakers' }, bonus: 1, label: '🛹 Street-Style Star' },
  { req: { hair: 'ponytail', shoes: 'sneakers' }, bonus: .4, label: '🎀 Sporty & Sweet' },
  { req: { hair: 'waves', shoes: 'heels' }, bonus: .4, label: '✨ Hollywood Glam' },
  { req: { hair: 'bob', skirt: 'plaid' }, bonus: .4, label: '🖤 Chic Schoolgirl' },
  { req: { top: 'whiteTee', skirt: 'pastelPink' }, bonus: .3, label: '🍓 Soft & Fresh' },
  { req: { top: 'neonGreen', skirt: 'pastelPink' }, bonus: -1.2, label: '⚠️ Neon vs. Pastel Clash', bad: true },
  { req: { top: 'neonGreen', shoes: 'heels' }, bonus: -.6, label: '⚠️ Neon + Pink Heels Mismatch', bad: true },
  { req: { top: 'pinkGlitter', skirt: 'denim', shoes: 'boots' }, bonus: .5, label: '🤠 Glam Cowgirl' }
];

function matches(req) {
  return Object.entries(req).every(([k, v]) => state[k] === v);
}

function evaluate() {
  const picks = Object.keys(CATALOG).map(cat => CATALOG[cat].items[state[cat]]);

  const vibeCount = {};
  picks.forEach(p => p.vibes.forEach(v => vibeCount[v] = (vibeCount[v] || 0) + 1));
  const maxVibe = Math.max(...Object.values(vibeCount));
  const harmony = maxVibe >= 4 ? 1.5 : maxVibe === 3 ? 1 : maxVibe === 2 ? .3 : -.5;

  const combos = COMBOS.filter(c => matches(c.req));
  const comboBonus = combos.reduce((s, c) => s + c.bonus, 0);

  const scores = JUDGES.map(j => {
    const base = picks.reduce((s, p) => s + p.cute * j.cuteW + p.style * j.styleW, 0) / picks.length;
    const favBonus = Math.min(1.2, (vibeCount[j.fav] || 0) * .3);
    let raw = base - .9 + harmony + favBonus + comboBonus;
    raw = Math.max(1, Math.min(10, raw));
    return Math.round(raw * 2) / 2;
  });

  const notes = [];
  if (maxVibe >= 3) {
    const top = Object.entries(vibeCount).sort((a, b) => b[1] - a[1])[0][0];
    notes.push({ label: `🌈 Cohesive ${top} vibe`, bad: false });
  } else if (maxVibe <= 1) {
    notes.push({ label: '🤔 Mixed-up vibes', bad: true });
  }
  combos.forEach(c => notes.push({ label: c.label, bad: !!c.bad }));
  return { scores, notes };
}

function tierOf(score) {
  return score >= 9.5 ? 3 : score >= 8 ? 2 : score >= 6 ? 1 : 0;
}

function heartsFor(score) {
  const full = Math.floor(score);
  const half = score % 1 !== 0;
  return '💖'.repeat(full) + (half ? '🩷' : '') + '🤍'.repeat(10 - full - (half ? 1 : 0));
}

/* =========================================================
   RUNWAY SHOW
   ========================================================= */
let showing = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function outfitDescription() {
  return Object.keys(CATALOG).map(c => CATALOG[c].items[state[c]].name).join(' · ');
}

function setControlsDisabled(dis) {
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = dis);
  $('startBtn').disabled = dis;
  $('randomBtn').disabled = dis;
}

async function startShow() {
  if (showing) return;
  showing = true;
  setControlsDisabled(true);
  $('scorecard').classList.remove('show');
  $('hint').style.opacity = 0;

  const wrap = $('modelWrap');
  wrap.classList.remove('walk');
  doll.classList.remove('posing', 'walking');
  void wrap.offsetWidth;

  $('caption').innerHTML = '<b>Now walking</b>' + outfitDescription();
  $('caption').classList.add('show');

  wrap.classList.add('walk');
  doll.classList.add('walking');

  const flashTimer = setInterval(() => {
    const n = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) setTimeout(() => cameraFlash(true), i * 60);
  }, 200);

  await sleep(5200);

  // final pose at the end of the runway
  doll.classList.remove('walking');
  wrap.classList.remove('walk');
  doll.classList.add('posing');
  $('caption').innerHTML = '<b>End of runway</b>Strike a pose 📸';
  whiteOut();
  for (let i = 0; i < 18; i++) setTimeout(() => cameraFlash(true), i * 50);
  await sleep(450);
  whiteOut();
  await sleep(1500);

  clearInterval(flashTimer);
  $('caption').classList.remove('show');
  await showScores();
  doll.classList.remove('posing');
}

async function showScores() {
  const { scores, notes } = evaluate();
  $('outfitLine').textContent = outfitDescription();
  const judgesEl = $('judges');
  judgesEl.innerHTML = '';
  $('totalBox').classList.remove('in');

  const cards = JUDGES.map((j, i) => {
    const s = scores[i];
    const pool = j.lines[tierOf(s)];
    const comment = pool[Math.floor(Math.random() * pool.length)];
    const card = document.createElement('div');
    card.className = 'judge';
    card.innerHTML = `
      <div class="avatar">${j.avatar}</div>
      <div class="name">${j.name}</div>
      <div class="role">${j.role}</div>
      <div class="score"><span class="num">0</span><small>/10</small></div>
      <div class="hearts">${heartsFor(s)}</div>
      <div class="comment">“${comment}”</div>`;
    judgesEl.appendChild(card);
    return card;
  });

  $('scorecard').classList.add('show');
  await sleep(450);

  for (let i = 0; i < cards.length; i++) {
    cards[i].classList.add('in');
    await countUp(cards[i].querySelector('.num'), scores[i]);
    await sleep(350);
  }

  const total = scores.reduce((a, b) => a + b, 0);
  $('totalScore').textContent = total % 1 ? total.toFixed(1) : total;
  $('rank').textContent =
    total >= 28 ? '👑 SUPERMODEL ICON' :
    total >= 24 ? '💖 Runway Star' :
    total >= 19 ? '✨ Rising Fashionista' : '🎀 Keep Styling!';
  $('notes').innerHTML = notes.map(n => `<span class="note ${n.bad ? 'bad' : ''}">${n.label}</span>`).join('');
  $('totalBox').classList.add('in');
  if (total >= 24) confetti(total >= 28 ? 140 : 70);
}

function countUp(el, target) {
  return new Promise(resolve => {
    const start = performance.now();
    const dur = 700;
    (function tick(now) {
      const t = Math.min(1, (now - start) / dur);
      const v = target * (1 - Math.pow(1 - t, 3));
      el.textContent = t < 1 ? v.toFixed(1) : (target % 1 ? target.toFixed(1) : target);
      if (t < 1) requestAnimationFrame(tick); else resolve();
    })(start);
  });
}

function confetti(count) {
  const stage = $('stage');
  const colors = ['#e8417f', '#f6d36b', '#ffffff', '#f7b6cf', '#c9a7ff'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.borderRadius = Math.random() < .4 ? '50%' : '2px';
    c.style.animationDuration = 2.2 + Math.random() * 2 + 's';
    c.style.animationDelay = Math.random() * .8 + 's';
    c.addEventListener('animationend', () => c.remove());
    stage.appendChild(c);
  }
}

function endShow() {
  $('scorecard').classList.remove('show');
  showing = false;
  setControlsDisabled(false);
  $('hint').style.opacity = 1;
}

/* =========================================================
   WIRE UP
   ========================================================= */
$('startBtn').addEventListener('click', startShow);
$('restyleBtn').addEventListener('click', endShow);
$('againBtn').addEventListener('click', () => { showing = false; startShow(); });
$('randomBtn').addEventListener('click', () => {
  for (const cat of Object.keys(CATALOG)) {
    const keys = Object.keys(CATALOG[cat].items);
    state[cat] = keys[Math.floor(Math.random() * keys.length)];
  }
  renderDoll();
  refreshActive();
  popDoll();
  whiteOut();
});

buildSidebar();
buildCrowd();
renderStatic();
renderDoll();
</script>
</body>
